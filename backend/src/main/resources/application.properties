# Nombre de la aplicación
spring.application.name=Soraka

# -----------------------------
# Puerto
# -----------------------------
# Render (y la mayoría de PaaS modernos) asignan el puerto dinámicamente
# mediante la variable de entorno PORT. Si no existe (ej. en local),
# se usa el valor por defecto 8080.
server.port=${PORT:8080}

# -----------------------------
# Configuración de la base de datos
# -----------------------------
# URL de conexión a MySQL (hosteado en Aiven), se agrega:
#   useSSL=true / requireSSL=true -> Aiven exige conexión cifrada SSL
#   serverTimezone=Europe/Madrid  -> zona horaria del servidor
#   allowPublicKeyRetrieval=true  -> permite la recuperación de la clave pública para autenticación SHA-256
# Variables genéricas (DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD)
# para que el proyecto no dependa de una plataforma de hosting concreta.
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&requireSSL=true&serverTimezone=Europe/Madrid&allowPublicKeyRetrieval=true

# Usuario y contraseña de la base de datos
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Driver JDBC de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -----------------------------
# Configuracion de Hibernate / JPA
# -----------------------------
# Configura como Hibernate maneja la creacion/actualizacion de tablas.
# "update" crea/actualiza las tablas automáticamente a partir de las
# entidades @Entity. Útil mientras no se usa Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=update

# Imprime cada sentencia SQL ejecutada
spring.jpa.show-sql=false

# Formatea las sentencias SQL impresas para que sean más legibles
spring.jpa.properties.hibernate.format_sql=true

# Fija el dialecto de MySQL para Hibernate (evita errores de "Unable to determine Dialect")
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Establecer zona horaria para Europa/Madrid
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Madrid

# -----------------------------
# Configuracion de correo (MAIL)
# -----------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# -----------------------------
# Configuracion JWT
# -----------------------------
jwt.secret=${SECRET_KEY}

# -----------------------------
# Configuracion CORS
# -----------------------------
cors.allowed-origin=${CORS_ALLOWED_ORIGIN}